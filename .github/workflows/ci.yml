name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Block secret-like files from being tracked
        run: |
          if git ls-files | grep -E '(\.pem$|(^|/)\.env$|(^|/)mcp_settings\.json$)'; then
            echo "Secret-like file is tracked in git. Remove it from the repo." >&2
            exit 1
          fi

      - run: pnpm lint
      - run: pnpm backend:build
      - run: pnpm frontend:typecheck
      - run: pnpm test:ci

  audit:
    name: Dependency audit (fails on critical only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Policy: critical blocks the pipeline. High and below are reported in the
      # audit report and handled by taking the next upstream release.
      - run: pnpm audit --prod --audit-level=critical
