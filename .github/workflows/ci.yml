name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Block secrets from being committed
        # mcp_settings.json is tracked on purpose (empty template). Block secret
        # material instead: key/env files, private key blocks, bcrypt hashes.
        run: |
          set -u
          bad=0
          if git ls-files | grep -E '(\.pem$|(^|/)\.env$)'; then echo "Key or env file is tracked." >&2; bad=1; fi
          # examples/oauth-server-config.json is upstream's sample config (not a credential); allowlisted by exact path.
          if git grep -nIE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' ; then echo "Private key material found." >&2; bad=1; fi
          if git grep -nIE -- '\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}' -- . ':(exclude)examples/oauth-server-config.json' ; then echo "bcrypt hash found in tracked file." >&2; bad=1; fi
          exit $bad

      - run: pnpm lint
      - run: pnpm backend:build
      - run: pnpm frontend:typecheck
      - run: pnpm test:ci

  audit:
    name: Dependency audit (fails on critical only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Policy: critical blocks the pipeline. High and below are reported in the
      # audit report and handled by taking the next upstream release.
      - run: pnpm audit --prod --audit-level=critical
