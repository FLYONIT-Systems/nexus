name: Rollback production

# Manual only. Swaps the server back to the previous directory kept by the last deploy.
# Does not restore the database; see deploy/README.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK to confirm'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back production
    if: inputs.confirm == 'ROLLBACK'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run rollback on server
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          NEXUS_SERVICE: ${{ secrets.NEXUS_SERVICE }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts deploy/rollback-nexus.sh "$TARGET:~/nexus-deploy/"
          $SSH "$TARGET" "cd ~/nexus-deploy && bash rollback-nexus.sh '$NEXUS_SERVICE'"
